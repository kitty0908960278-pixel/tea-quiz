{background:var(--green);border-color:var(--ink)}.options button.selected:before{content:'✿';color:#685b35}.track{height:13px;background:#f2e1ad;border:1.5px solid var(--ink);border-radius:12px;overflow:hidden}.fill{height:100%;background:#a5ba70;border-radius:10px;transition:width .25s}.center{text-align:center}.art{font-size:52px;margin:16px 0}.art img{width:100%;max-width:300px;height:auto;border:5px solid white;border-radius:24px;box-shadow:2px 3px 0 #d5c4a2}.art .poster{max-width:250px;max-height:320px;object-fit:contain;background:var(--cream);transform:rotate(-2deg)}.quote{font-size:22px;color:#854b38;background:#f9d7c2;border-radius:18px 12px;padding:12px}.details{background:#f4e3ae;border:1.5px dashed var(--ink);border-radius:18px 13px;padding:18px;margin:16px 0;text-align:left}.details:nth-of-type(3){background:#e7edc4}.actions{display:grid;gap:12px;margin-top:20px}.footer{text-align:center;font-size:12px;color:#75634d;margin-top:28px}.nav{display:flex;justify-content:space-between;gap:12px}.nav button{flex:1}.nav button:last-child:not(:disabled){background:var(--green)}hr{border:0;border-top:1px dashed #a28c6e;margin:16px 0}.ornament{font-size:18px;letter-spacing:.5em;color:#9a7943;text-align:center;margin:12px 0}@media(prefers-reduced-motion:reduce){*{transition:none!important}}

function start(){answers=[];step=0;orders=questions.map(()=>shuffle(keys));render()}
function render(){document.body.dataset.page="quiz";const q=questions[step];screen.innerHTML=`<p class="muted">茶香旅程 · ${step+1} / ${questions.length}</p><div class="track" role="progressbar" aria-label="作答進度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="${step+1}"><div class="fill" style="width:${(step+1)*20}%"></div></div><h2>${q[0]}</h2><div class="options">${orders[step].map(k=>`<button class="${answers[step]===k?'selected':''}" aria-pressed="${answers[step]===k}" onclick="choose('${k}')">${q[1][keys.indexOf(k)]}</button>`).join('')}</div><div class="nav"><button onclick="back()" ${step===0?'disabled':''}>← 上一題</button><button onclick="next()" ${answers[step]?'':'disabled'}>${step===4?'揭曉我的茶香':'下一題 →'}</button></div>`}
function choose(k){answers[step]=k;render()}
function back(){if(step>0){step--;render()}}
function next(){if(!answers[step])return;if(step<4){step++;render()}else finish()}
function finish(){document.body.dataset.page="result";const scores=Object.fromEntries(keys.map(k=>[k,answers.filter(a=>a===k).length]));const max=Math.max(...Object.values(scores));const tied=keys.filter(k=>scores[k]===max);resultKey=[...answers].reverse().find(k=>tied.includes(k));const d=resultsData[resultKey],t=traits[resultKey];const tea=d.desc.split('<br><br>')[0];screen.innerHTML=`<div class="result-layout"><div class="center result-hero"><p class="eyebrow">你的命定茶香是</p><h1>${d.name}</h1><p>${t[0]}｜${d.tea}</p><div class="art">${d.avatar}</div><p class="quote">「${t[1]}」</p><p>${t[2]}</p></div><div class="result-info"><div class="details"><strong>隱藏技能</strong><br><span>${t[3]}</span><hr><strong>可愛小缺點</strong><br><span>${t[4]}</span><hr><strong>推薦茶友</strong><br><span>${resultsData[t[5]].name}</span></div><div class="details"><strong>認識你的命定茶香</strong><p>${tea}</p><p>下次走進茶行，不妨找找這款茶，感受它獨特的香氣！</p></div></div></div><div class="actions"><button class="primary" onclick="shareResult()">分享我的茶香結果</button><button onclick="saveCard()">儲存我的人格小卡 ↓</button><button onclick="start()">再玩一次</button><button onclick="home()">返回首頁</button></div><p id="status" role="status" class="muted"></p>`;cardPromise=makeCard();cardPromise.catch(()=>{});screen.querySelector('img')?.addEventListener('error',e=>{e.target.replaceWith(document.createTextNode(({A:'🐱',B:'🐶',C:'🐰',D:'🐻',E:'🦊'})[resultKey]))})}
let cardPromise=null;
function downloadCard(blob){const a=document.createElement('a');a.download=resultsData[resultKey].name+'.png';a.href=URL.createObjectURL(blob);a.click();setTimeout(()=>URL.revokeObjectURL(a.href),30000)}
async function shareResult(){const status=document.getElementById('status');try{const blob=await (cardPromise||makeCard());const file=new File([blob],resultsData[resultKey].name+'.png',{type:'image/png'});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({files:[file],title:'我的命定茶香'});}else{downloadCard(blob);status.textContent='已下載結果圖片，可傳給朋友或上傳限時動態。'}}catch(e){if(e.name!=='AbortError')status.textContent='分享未完成，請使用儲存人格小卡。'}}
async function saveCard(){try{downloadCard(await (cardPromise||makeCard()));document.getElementById('status').textContent='已下載人格小卡。'}catch(e){document.getElementById('status').textContent='無法儲存圖片，請重試。'}}
async function makeCard(){const d=resultsData[resultKey],t=traits[resultKey],c=document.createElement('canvas');c.width=900;c.height=1200;const x=c.getContext('2d');x.fillStyle='#fff0c3';x.fillRect(0,0,900,1200);for(const [a,b,r,col] of [[0,0,220,'#f2d891'],[900,350,180,'#dce5a3'],[0,1150,200,'#dce5a3'],[900,1200,210,'#f2d891']]){x.fillStyle=col;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}x.textAlign='center';x.fillStyle='#65594d';x.font='30px serif';x.fillText('新芳春茶行・茶縷',450,75);x.font='bold 64px serif';x.fillStyle='#b65e4b';x.fillText(d.name,450,170);x.fillStyle='#65594d';x.font='36px serif';x.fillText(t[0]+'｜'+d.tea,450,235);const img=new Image();img.src=new DOMParser().parseFromString(d.avatar,'text/html').querySelector('img').src;try{await img.decode();x.save();x.beginPath();x.roundRect(190,280,520,520,35);x.clip();const scale=Math.min(520/img.width,520/img.height);const w=img.width*scale,h=img.height*scale;x.drawImage(img,450-w/2,540-h/2,w,h);x.restore();x.font='32px serif';x.fillText('「'+t[1]+'」',450,860,800);x.font='30px serif';x.fillText('隱藏技能：'+t[3],450,950,800);x.fillText('可愛小缺點：'+t[4],450,1005,800);x.fillText('推薦茶友：'+resultsData[t[5]].name,450,1060,800);x.font='24px serif';x.fillText('如果你是一杯茶？｜趣味人格測驗',450,1150);return await new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('PNG')),'image/png'))}catch(e){throw e}}
